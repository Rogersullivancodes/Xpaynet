<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X Money</title>
<style>
  :root {
    --bg: #000;
    --card: #111;
    --card-2: #1c1c1c;
    --text: #fff;
    --muted: #9a9a9a;
    --green: #fff;
    --red: #fff;
    --accent: #fff;
    --accent-2: #888;
    --radius: 20px;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #ffffff12, transparent), var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 48px;
  }
  .app { max-width: 720px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; letter-spacing: .3px; }
  .logo {
    width: auto; height: auto; background: none; box-shadow: none;
    display: grid; place-items: center; font-weight: 900; font-size: 1.8rem; color: #fff; line-height: 1;
  }
  .avatar {
    height: 36px; padding: 0 14px; border-radius: 999px;
    background: var(--card);
    display: grid; place-items: center; font-weight: 600; font-size: .78rem; text-transform: none;
    border: 1px solid rgba(255,255,255,.15); cursor: pointer;
    transition: transform .2s;
  }
  .avatar:hover { transform: scale(1.08); }

  .hero {
    background: linear-gradient(135deg, #1a1a1a 0%, #3b3b3b 50%, #0d0d0d 100%);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 28px; padding: 26px 24px; box-shadow: var(--shadow);
    position: relative; overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; width: 260px; height: 260px; right: -80px; top: -90px;
    background: rgba(255,255,255,.12); border-radius: 50%;
  }
  .hero-top { display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 1; }
  .hero-label { font-size: .85rem; opacity: .85; text-transform: uppercase; letter-spacing: 1px; }
  .eye {
    background: rgba(255,255,255,.18); border: none; color: #fff; width: 38px; height: 38px;
    border-radius: 50%; cursor: pointer; display: grid; place-items: center; transition: background .2s, transform .2s;
  }
  .eye:hover { background: rgba(255,255,255,.3); transform: scale(1.06); }
  .eye svg { width: 20px; height: 20px; }
  .balance { font-size: clamp(2.3rem, 9vw, 3.4rem); font-weight: 800; margin: 14px 0 6px; position: relative; z-index: 1; letter-spacing: -1px; }
  .hero-sub { font-size: .85rem; opacity: .85; position: relative; z-index: 1; }

  .actions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0; }
  .action {
    background: var(--card); border: 1px solid rgba(255,255,255,.06); color: var(--text);
    border-radius: 18px; padding: 16px 6px; cursor: pointer; font-size: .85rem; font-weight: 600;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: transform .18s, background .18s, box-shadow .18s;
  }
  .action:hover { transform: translateY(-3px); background: var(--card-2); box-shadow: var(--shadow); }
  .action:active { transform: translateY(0) scale(.97); }
  .action .ico {
    width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 1.2rem;
    background: #000; border: 1px solid rgba(255,255,255,.25);
  }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 26px; }
  .stat { background: var(--card); border-radius: var(--radius); padding: 16px; border: 1px solid rgba(255,255,255,.06); }
  .stat small { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .8px; }
  .stat strong { display: block; font-size: 1.35rem; margin-top: 6px; }
  .stat.in strong { color: var(--green); }
  .stat.out strong { color: var(--red); }

  h2 { font-size: 1.05rem; margin-bottom: 12px; }
  .tx-list { background: var(--card); border-radius: var(--radius); padding: 6px; border: 1px solid rgba(255,255,255,.06); }
  .tx {
    display: flex; align-items: center; gap: 14px; padding: 13px 12px; border-radius: 14px;
    cursor: pointer; transition: background .15s, transform .15s;
  }
  .tx:hover { background: var(--card-2); transform: translateX(3px); }
  .tx-icon { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 1.3rem; background: var(--card-2); flex-shrink: 0; }
  .tx-info { flex: 1; min-width: 0; }
  .tx-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx-date { color: var(--muted); font-size: .8rem; margin-top: 2px; }
  .tx-amt { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
  .tx-icon { background: #000; border: 1px solid rgba(255,255,255,.25); color: #fff; font-weight: 700; }
  .credit { color: #fff; }
  .debit { color: #fff; }
  .status {
    display: inline-block; margin-top: 4px; font-size: .68rem; font-weight: 600; letter-spacing: .5px;
    text-transform: uppercase; color: #fff; border: 1px solid rgba(255,255,255,.5); border-radius: 999px; padding: 2px 8px;
  }
  .status::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #fff; margin-right: 6px; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 30px);
    background: #fff; color: #111; padding: 12px 20px; border-radius: 999px; font-weight: 600; font-size: .9rem;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 10;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (min-width: 640px) {
    body { padding-top: 40px; }
    .hero { padding: 34px 32px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">X</div>X Money</div>
    <div class="avatar" title="Profile">@leskobro</div>
  </header>

  <section class="hero">
    <div class="hero-top">
      <span class="hero-label">Available Balance</span>
      <button class="eye" id="eyeBtn" aria-label="Toggle balance visibility"></button>
    </div>
    <div class="balance" id="balance"></div>
    <div class="hero-sub">Checking • •••• 4821</div>
  </section>

  <div class="actions" id="actions"></div>

  <section class="stats">
    <div class="stat in"><small>Income this month</small><strong id="income"></strong></div>
    <div class="stat out"><small>Spent this month</small><strong id="spent"></strong></div>
  </section>

  <h2>Recent Transactions</h2>
  <div class="tx-list" id="txList"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- Data (edit freely) ----------
  const balance = 1050.00;

  const transactions = [
    { icon: "↑", name: "Withdrawal to Coinbase", date: "2026-10-22", amount: -1430.00, status: "Processing" },
    { icon: "↓", name: "Incoming from Xmoney",   date: "2026-10-20", amount: 1430.00 }
  ];

  const quickActions = [
    { label: "Send",    icon: "↗" },
    { label: "Request", icon: "↙" },
    { label: "Top Up",  icon: "＋" },
    { label: "Pay",     icon: "💳" }
  ];

  // ---------- Helpers ----------
  const usd = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const $ = id => document.getElementById(id);

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 1800);
  }

  // ---------- Balance toggle ----------
  const eyeOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  const eyeOff  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.9 10.9 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  let hidden = false;

  function renderBalance() {
    $("balance").textContent = hidden ? "••••••" : usd.format(balance);
    $("eyeBtn").innerHTML = hidden ? eyeOff : eyeOpen;
  }
  $("eyeBtn").addEventListener("click", () => { hidden = !hidden; renderBalance(); });

  // ---------- Quick actions ----------
  $("actions").innerHTML = quickActions.map(a =>
    `<button class="action" data-label="${a.label}"><span class="ico">${a.icon}</span>${a.label}</button>`
  ).join("");
  $("actions").addEventListener("click", e => {
    const btn = e.target.closest(".action");
    if (btn) toast(`${btn.dataset.label} tapped`);
  });

  // ---------- Transactions ----------
  $("txList").innerHTML = transactions.map(t => `
    <div class="tx">
      <div class="tx-icon">${t.icon}</div>
      <div class="tx-info">
        <div class="tx-name">${t.name}</div>
        <div class="tx-date">${fmtDate(t.date)}</div>
        ${t.status ? `<span class="status">${t.status}</span>` : ""}
      </div>
      <div class="tx-amt ${t.amount >= 0 ? "credit" : "debit"}">
        ${t.amount >= 0 ? "+" : "−"}${usd.format(Math.abs(t.amount))}
      </div>
    </div>`).join("");

  // ---------- Stats ----------
  const income = transactions.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);
  const spent  = transactions.filter(t => t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
  $("income").textContent = usd.format(income);
  $("spent").textContent  = usd.format(spent);

  renderBalance();
</script>
</body>
</html>
